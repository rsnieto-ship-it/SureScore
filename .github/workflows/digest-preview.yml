name: "Digest — Monday Preview"

on:
  schedule:
    # 08:00 UTC Monday = 3:00 AM CDT / 2:00 AM CST. Scheduled well before the
    # 7am CT target because GH Actions cron on this repo drifts 90-200+ min
    # late; even with worst-case drift the preview lands before Roy's
    # Monday-morning meeting. Tradeoff (accepted 2026-07-06): stories
    # published later Monday miss the candidate batch (e.g. Texas Tribune's
    # "historic enrollment drop" piece, 2026-05-11, published 11:02 AM CT).
    # Late-breaking articles can be injected manually with
    # `surescore_digest.py --add URL` before selection.
    # The window gate below accepts hours 2-9 CT.
    - cron: "0 8 * * 1"
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: digest-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: digest-script

    steps:
      - name: Check Central time is in morning window
        id: tz-check
        working-directory: .
        run: |
          CENTRAL_HOUR=$((10#$(TZ="America/Chicago" date +%H)))
          echo "Central time hour: $CENTRAL_HOUR"
          if [ "$CENTRAL_HOUR" -lt 2 ] || [ "$CENTRAL_HOUR" -gt 9 ]; then
            echo "Outside 2–9 CT window — skipping. Hour is $CENTRAL_HOUR."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tz-check.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.tz-check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.tz-check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run preview
        if: steps.tz-check.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          ROY_EMAIL: ${{ secrets.ROY_EMAIL }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python surescore_digest.py --preview

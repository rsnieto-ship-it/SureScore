name: "Digest — Tuesday Send All"

on:
  schedule:
    # GH Actions cron has consistently drifted 90–200+ minutes late on this
    # repo (observed across 7+ weekly runs). Earlier cron + Wednesday fallback
    # ensures the send still lands inside the window gate even with worst-case
    # drift.
    #
    # 10:00 UTC Tuesday = 5:00 AM CDT / 4:00 AM CST.
    #   With observed drift: expected actual fire 6:30–8:00 AM CT (inside gate).
    # 12:00 UTC Wednesday = 7:00 AM CDT / 6:00 AM CST.
    #   Backup in case Tuesday is missed. Wed is in SEND_ALLOWED_DAYS so the
    #   script's day guard passes; DigestSendLog idempotency prevents double-send.
    - cron: "0 10 * * 2"
    - cron: "0 12 * * 3"
  workflow_dispatch: # Allow manual trigger from GitHub UI
    inputs:
      force:
        description: "Override day-of-week guard (Tue/Wed only). Required for manual sends outside the normal window."
        required: false
        type: boolean
        default: false

jobs:
  send-all:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digest-script

    steps:
      - name: Check Central time is in morning window
        id: tz-check
        run: |
          CENTRAL_HOUR=$((10#$(TZ="America/Chicago" date +%H)))
          echo "Central time hour: $CENTRAL_HOUR"
          if [ "$CENTRAL_HOUR" -lt 6 ] || [ "$CENTRAL_HOUR" -gt 11 ]; then
            echo "Outside 6–11 CT window — skipping. Hour is $CENTRAL_HOUR."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.tz-check.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.tz-check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.tz-check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Send to all subscribers
        if: steps.tz-check.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          ROY_EMAIL: ${{ secrets.ROY_EMAIL }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python surescore_digest.py --send-all --force
          else
            python surescore_digest.py --send-all
          fi

name: "Digest — Utility Command"

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run (e.g., --clicks tia, --show-rubric, --analytics)"
        required: true
        type: string

# Shares the send group so a utility command can never overlap a mass send
concurrency:
  group: digest-send
  cancel-in-progress: false

jobs:
  util:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: digest-script

    steps:
      - name: Block send-capable commands
        working-directory: .
        env:
          CMD: ${{ github.event.inputs.command }}
        run: |
          # This workflow is for read-only/diagnostic commands. Mass sends go
          # through digest-send-batch1.yml only (CLAUDE.md: never create a
          # side door that can send to all subscribers).
          case "$CMD" in
            *--send-all*|*--send-digest*|*--force*|*--auto*)
              echo "🚫 BLOCKED: '$CMD' is send-capable. Use the dedicated send workflow."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run command
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          DIGEST_RECIPIENTS: ${{ secrets.DIGEST_RECIPIENTS }}
          ROY_EMAIL: ${{ secrets.ROY_EMAIL }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Input passed via env var, not template interpolation — the old
          # direct ${{ }} splice let shell metacharacters in the input run
          # arbitrary commands in a job holding every production secret.
          CMD: ${{ github.event.inputs.command }}
        run: python surescore_digest.py $CMD
